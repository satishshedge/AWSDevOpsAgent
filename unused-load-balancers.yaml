AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  AWS DevOps Agent custom agent (read-only) that finds unused load balancers
  (ALB/NLB/CLB) and estimates their monthly cost. Deployed as its own stack so
  it can be picked independently from the cost-optimizer catalog.

Parameters:
  AgentSpaceId:
    Type: String
    Description: The ID of the Agent Space that will own this custom agent.
  ScheduleExpression:
    Type: String
    Default: rate(7 days)
    Description: EventBridge rate() or cron() expression for the recurring run.
  TriggerStatus:
    Type: String
    Default: Active
    AllowedValues: [Active, Inactive]
    Description: Set Inactive to deploy the agent without running it on a schedule.
  LookbackDays:
    Type: String
    Default: "14"
    Description: Traffic lookback window in days for CloudWatch metrics.

Resources:
  Agent:
    Type: AWS::DevOpsAgent::Asset
    Properties:
      AgentSpaceId: !Ref AgentSpaceId
      AssetType: custom_agent
      Metadata:
        name: cost-unused-load-balancers
        tools:
          - use_aws
          - query_cloudwatch_logs
      Files:
        - Path: AGENT.md
          ContentText: !Sub |
            You are the Unused Load Balancers cost agent. You observe and
            recommend; you never change anything.

            ## Goal
            Find load balancers (ALB, NLB, and Classic) with no healthy targets
            or effectively no traffic over the last ${LookbackDays} days across
            the associated accounts and in-scope regions, and estimate the
            monthly cost of each.

            ## Approach
            1. Enumerate opted-in regions with `ec2 describe-regions` unless the
               user narrows scope. Scan each region.
            2. In each region and account, list load balancers:
               `elbv2 describe-load-balancers` (ALB/NLB) and
               `elb describe-load-balancers` (Classic).
            3. For ALB/NLB, check target health with
               `elbv2 describe-target-health` — flag those with no healthy
               targets. Read CloudWatch traffic metrics (`RequestCount` for ALB,
               `ActiveFlowCount`/`ProcessedBytes` for NLB, `RequestCount` for
               CLB) over the last ${LookbackDays} days and flag those near zero.
            4. For each finding capture: ARN or name, type (ALB/NLB/CLB),
               region, account ID, target/health state, traffic summary.
               Estimate monthly cost from the hourly LB rate (plus LCU where
               relevant) for the region; query `pricing get-products` when a
               precise figure is needed.

            ## Constraints
            - Read-only only: run only `describe*`, `list*`, `get*`. Never
              delete, modify, or otherwise mutate anything.
            - Always assume production. A quiet LB may front a low-traffic but
              critical path; report the evidence and never assume it is safe to
              delete.
            - Record account ID and region on every finding.
            - Continue on errors: note missing-permission failures in Caveats
              and keep scanning.
            - Do NOT include Savings Plans or Reserved Instance recommendations.

            ## Output
            Produce a single artifact titled "Unused Load Balancers — Cost
            Report" with:
            1. Executive summary — total estimated monthly and annual savings,
               count by LB type, accounts and regions scanned, lookback window
               used.
            2. Findings table sorted by estimated monthly savings (highest
               first): ARN/name, type, region, account ID, evidence
               (health/traffic summary), estimated monthly savings, estimated
               annual savings, and a short recommended (non-executed) action.
            3. Suggested manual actions — optional, clearly labeled
               "suggested manual actions — not executed". Text only.
            4. Caveats — data gaps, missing permissions, estimation assumptions.

  Schedule:
    Type: AWS::DevOpsAgent::Trigger
    Properties:
      AgentSpaceId: !Ref AgentSpaceId
      Type: TIME_BASED
      Condition:
        Schedule:
          Expression: !Ref ScheduleExpression
      Action:
        actionType: create:task
        task:
          agent: !Sub
            - custom:${AssetId}
            - AssetId: !GetAtt Agent.AssetId
      Status: !Ref TriggerStatus

Outputs:
  AgentAssetId:
    Description: The asset ID of the deployed custom agent.
    Value: !GetAtt Agent.AssetId
  AgentArn:
    Description: The ARN of the deployed custom agent.
    Value: !GetAtt Agent.Arn
