AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  AWS DevOps Agent custom agent (read-only) that finds serverless
  over-provisioning — idle Lambda functions, over-provisioned Lambda memory, and
  over-provisioned DynamoDB tables. Deployed as its own stack so it can be
  picked independently from the cost-optimizer catalog.

Parameters:
  AgentSpaceId:
    Type: String
    Description: The ID of the Agent Space that will own this custom agent.
  ScheduleExpression:
    Type: String
    Default: rate(7 days)
    Description: EventBridge rate() or cron() expression for the recurring run.
  TriggerStatus:
    Type: String
    Default: Active
    AllowedValues: [Active, Inactive]
    Description: Set Inactive to deploy the agent without running it on a schedule.
  LookbackDays:
    Type: String
    Default: "14"
    Description: Utilization lookback window in days for CloudWatch metrics.

Resources:
  Agent:
    Type: AWS::DevOpsAgent::Asset
    Properties:
      AgentSpaceId: !Ref AgentSpaceId
      AssetType: custom_agent
      Metadata:
        name: cost-serverless-overprovisioning
        tools:
          - use_aws
          - query_cloudwatch_logs
      Files:
        - Path: AGENT.md
          ContentText: !Sub |
            You are the Serverless Over-provisioning cost agent. You observe and
            recommend; you never change anything.

            ## Goal
            Find serverless waste across the associated accounts and in-scope
            regions over the last ${LookbackDays} days — idle/unused Lambda
            functions, over-provisioned Lambda memory, and over-provisioned
            DynamoDB tables — and estimate the monthly savings of each.

            ## Approach
            1. Enumerate opted-in regions with `ec2 describe-regions` unless the
               user narrows scope. Scan each region.
            2. Lambda — `lambda list-functions`; read CloudWatch `Invocations`
               and `Duration` over the last ${LookbackDays} days. Flag functions
               with no invocations (idle) and functions whose configured memory
               is far above observed `MaxMemoryUsed` (over-provisioned). Prefer
               Compute Optimizer Lambda recommendations
               (`compute-optimizer get-lambda-function-recommendations`) when
               available.
            3. DynamoDB — `dynamodb list-tables` and `dynamodb describe-table`;
               for tables in PROVISIONED mode, compare provisioned vs consumed
               read/write capacity from CloudWatch and flag tables provisioned
               far above consumption with no autoscaling.
            4. For each finding capture: resource name, service (Lambda or
               DynamoDB), region, account ID, evidence (invocation/memory or
               capacity summary), and estimated monthly savings; query
               `pricing get-products` when a precise figure is needed and label
               estimates.

            ## Constraints
            - Read-only only: run only `describe*`, `list*`, `get*`. Never
              update function config, change table capacity, or otherwise mutate
              anything.
            - Always assume production. A quiet function or table may be a
              failover or seasonal path; report the evidence and never assume it
              is safe to change.
            - Record account ID and region on every finding.
            - Continue on errors: note missing-permission failures in Caveats
              and keep scanning.
            - Do NOT include Savings Plans or Reserved Instance recommendations.

            ## Output
            Produce a single artifact titled "Serverless Over-provisioning —
            Cost Report" with:
            1. Executive summary — total estimated monthly and annual savings,
               count by service (Lambda vs DynamoDB), accounts and regions
               scanned, lookback window used.
            2. Findings table sorted by estimated monthly savings (highest
               first): resource name, service, region, account ID, evidence,
               estimated monthly savings, estimated annual savings, and a short
               recommended (non-executed) action.
            3. Suggested manual actions — optional, clearly labeled
               "suggested manual actions — not executed". Text only.
            4. Caveats — data gaps, missing permissions, estimation assumptions.

  Schedule:
    Type: AWS::DevOpsAgent::Trigger
    Properties:
      AgentSpaceId: !Ref AgentSpaceId
      Type: TIME_BASED
      Condition:
        Schedule:
          Expression: !Ref ScheduleExpression
      Action:
        actionType: create:task
        task:
          agent: !Sub
            - custom:${AssetId}
            - AssetId: !GetAtt Agent.AssetId
      Status: !Ref TriggerStatus

Outputs:
  AgentAssetId:
    Description: The asset ID of the deployed custom agent.
    Value: !GetAtt Agent.AssetId
  AgentArn:
    Description: The ARN of the deployed custom agent.
    Value: !GetAtt Agent.Arn
