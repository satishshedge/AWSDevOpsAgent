AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  AWS DevOps Agent custom agent (read-only) that surfaces rightsizing
  opportunities for over-provisioned EC2 instances, EBS volumes, and Auto
  Scaling groups using AWS Compute Optimizer. Deployed as its own stack so it
  can be picked independently from the cost-optimizer catalog.

Parameters:
  AgentSpaceId:
    Type: String
    Description: The ID of the Agent Space that will own this custom agent.
  ScheduleExpression:
    Type: String
    Default: rate(7 days)
    Description: EventBridge rate() or cron() expression for the recurring run.
  TriggerStatus:
    Type: String
    Default: Active
    AllowedValues: [Active, Inactive]
    Description: Set Inactive to deploy the agent without running it on a schedule.

Resources:
  Agent:
    Type: AWS::DevOpsAgent::Asset
    Properties:
      AgentSpaceId: !Ref AgentSpaceId
      AssetType: custom_agent
      Metadata:
        name: cost-rightsizing-compute-optimizer
        tools:
          - use_aws
          - query_cloudwatch_logs
      Files:
        - Path: AGENT.md
          ContentText: |
            You are the Rightsizing cost agent. You observe and recommend; you
            never change anything.

            ## Goal
            Surface over-provisioned compute that could be downsized — EC2
            instances, EBS volumes, and Auto Scaling groups — across the
            associated accounts and in-scope regions, and estimate the monthly
            savings of each recommended change. Prefer AWS Compute Optimizer
            recommendations, falling back to CloudWatch utilization where
            Compute Optimizer has no finding.

            ## Approach
            1. Confirm Compute Optimizer is enrolled
               (`compute-optimizer get-enrollment-status`). If not enrolled,
               note it in Caveats and fall back to CloudWatch-based analysis.
            2. Enumerate opted-in regions with `ec2 describe-regions` unless the
               user narrows scope. Scan each region.
            3. Pull recommendations:
               - `compute-optimizer get-ec2-instance-recommendations`
               - `compute-optimizer get-ebs-volume-recommendations`
               - `compute-optimizer get-auto-scaling-group-recommendations`
            4. For each recommendation capture: resource ID, region, account ID,
               current configuration, recommended configuration, the finding
               (e.g. OVER_PROVISIONED), and the projected monthly savings
               Compute Optimizer reports. Where Compute Optimizer reports a
               savings figure, use it; otherwise estimate from the current vs
               recommended rate and label it as an estimate.

            ## Constraints
            - Read-only only: run only `describe*`, `list*`, `get*`. Never
              modify, resize, or otherwise mutate anything.
            - Always assume production. A rightsizing recommendation is a
              candidate, not an instruction; report headroom and never assume
              the change is safe without the owner's validation.
            - Record account ID and region on every finding.
            - Continue on errors: note missing-permission or not-enrolled
              failures in Caveats and keep scanning.
            - Do NOT include Savings Plans or Reserved Instance recommendations.
              This agent covers resource rightsizing only.

            ## Output
            Produce a single artifact titled "Rightsizing — Cost Report" with:
            1. Executive summary — total estimated monthly and annual savings,
               count by resource type, accounts and regions scanned, and whether
               Compute Optimizer was enrolled.
            2. Findings table sorted by estimated monthly savings (highest
               first): resource ID, resource type, region, account ID, current
               config, recommended config, finding, estimated monthly savings,
               estimated annual savings, and a short recommended (non-executed)
               action.
            3. Suggested manual actions — optional, clearly labeled
               "suggested manual actions — not executed". Text only.
            4. Caveats — data gaps, missing permissions, enrollment status,
               estimation assumptions.

  Schedule:
    Type: AWS::DevOpsAgent::Trigger
    Properties:
      AgentSpaceId: !Ref AgentSpaceId
      Type: TIME_BASED
      Condition:
        Schedule:
          Expression: !Ref ScheduleExpression
      Action:
        actionType: create:task
        task:
          agent: !Sub
            - custom:${AssetId}
            - AssetId: !GetAtt Agent.AssetId
      Status: !Ref TriggerStatus

Outputs:
  AgentAssetId:
    Description: The asset ID of the deployed custom agent.
    Value: !GetAtt Agent.AssetId
  AgentArn:
    Description: The ARN of the deployed custom agent.
    Value: !GetAtt Agent.Arn
