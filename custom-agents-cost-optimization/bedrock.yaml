AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  AWS DevOps Agent custom agent (read-only) that generates Bedrock cost
  optimization recommendations, priced with Cost Explorer (bill-accurate) and a
  Price List fallback. Deploy independently from the cost optimization catalog.

Parameters:
  AgentSpaceId:
    Type: String
    Description: The ID of the Agent Space that will own this custom agent.
  ScheduleExpression:
    Type: String
    Default: rate(7 days)
    Description: EventBridge rate() or cron() expression for the recurring run.
  TriggerStatus:
    Type: String
    Default: Active
    AllowedValues: [Active, Inactive]
    Description: Set Inactive to deploy the agent without running it on a schedule.
  LookbackDays:
    Type: String
    Default: "14"
    Description: Utilization lookback window in days for CloudWatch metrics.
  CostLookbackDays:
    Type: String
    Default: "30"
    Description: >-
      How many days of Cost Explorer history to pull for costing, ending
      yesterday (today is always excluded because its data is incomplete).

Resources:
  Agent:
    Type: AWS::DevOpsAgent::Asset
    Properties:
      AgentSpaceId: !Ref AgentSpaceId
      AssetType: custom_agent
      Metadata:
        name: cost-bedrock
        tools:
          - use_aws
          - query_cloudwatch_logs
        # skills:   # import 'bedrock-troubleshooting' into the Agent Space first, then enable
        #   - bedrock-troubleshooting
      Files:
        - Path: AGENT.md
          ContentText: !Sub |
            You are the Bedrock Cost Optimization agent. You observe and recommend;
            you never change anything.

            ## Goal
            Find Bedrock waste - Provisioned Throughput model units running below utilization and idle provisioned commitments.
            Price each finding against what the account was actually billed rather than
            public list prices.

            ## Approach

            ### Step 1 - Detect waste (real-time configuration + metrics)
            Enumerate opted-in regions with `ec2 describe-regions` unless the user narrows
            scope, then scan each region and account. Read utilization from CloudWatch over the last ${LookbackDays} days where relevant.

                        1. List provisioned throughput (`bedrock list-provisioned-model-throughputs`, `get-provisioned-model-throughput`).
                        2. Read invocation metrics from CloudWatch against provisioned model units.
                        3. Flag provisioned throughput running well below capacity where on-demand would cost less.

            Savings levers to look for: provisioned-throughput rightsizing, on-demand versus provisioned fit.

            ### Step 2 - Establish the cost window (CRITICAL: never include today)
            Cost Explorer data for the current day is incomplete and returns near-zero, so it
            must be excluded or it will understate cost.

                        4. Determine today's UTC date. Set the cost window END to **today** (the
                            Cost Explorer `End` bound is exclusive, so this makes yesterday the last
                            day actually included) and the START to ${CostLookbackDays} days before
                            yesterday.
                        5. Record the exact window you used. Every cost figure in the report must be
                            attributed to this window, not to "now".

            ### Step 3 - Price the findings with Cost Explorer (bill-accurate)
                        6. Pull this service's spend for the window with `ce get-cost-and-usage`,
                            `--granularity DAILY`, `--metrics UnblendedCost UsageQuantity`,
                            filtered to the service dimension `Amazon Bedrock`. Group by `SERVICE`, `USAGE_TYPE`,
                            `LINKED_ACCOUNT` and `REGION` to attribute cost to findings.
                        7. Where resource-level attribution is needed and the window falls inside the
                            last 14 days, use `ce get-cost-and-usage-with-resources` (that operation
                            only supports the trailing 14 days).
                        8. **Check the `Estimated` flag on every Cost Explorer result.** Cost Explorer
                            marks data provisional until the bill closes. If any period used is
                            `Estimated: true`, the derived savings are provisional - say so explicitly
                            rather than presenting them as final.
                        9. Optionally call `ce get-anomalies` for the window and note any cost
                            anomalies for this service that overlap a finding.

            ### Step 4 - Reconcile findings against cost (mismatch detection)
            The inventory is real-time but the cost data ends yesterday, so the two can
            legitimately disagree. Classify every finding:

                        10. **Matched** - resource exists now AND has cost in the window. Report the
                            billed cost and the projected saving. Highest-confidence case.
                        11. **Too new to cost** - resource exists now but has NO cost in the window
                            (created today or after the window closed). Do NOT report "$0 savings",
                            which would wrongly deprioritize real waste. Label it "cost not yet
                            available (resource newer than the cost window)" and fall back to a Price
                            List estimate per Step 5.
                        12. **Already gone** - cost appears in the window but the resource is NOT in the
                            live inventory (deleted during or after the window). Do NOT recommend
                            deleting it. Report it as "already removed - no action required; cost is
                            historical only".
                        13. Never silently do arithmetic across these classes. A total that mixes
                            billed and estimated figures must state the split.

            ### Step 5 - Price List fallback
                        14. When Cost Explorer is unavailable (missing `ce:` permissions) or returns no
                            data for a finding, fall back to `pricing get-products` list pricing. Mark
                            every such figure clearly as "list-price estimate - excludes your
                            discounts, credits and commitment coverage".

            ### Step 6 - Commitment-coverage caution
                        15. Cost Explorer reflects amortized/committed spend. If a finding is covered by
                            a Reserved Instance or Savings Plan, removing the resource may save far
                            less than its billed cost, because the commitment is paid regardless. Where
                            the data suggests commitment coverage, flag the saving as "may be lower
                            than shown - resource appears covered by a commitment". Do not recommend
                            buying or changing commitments.

            ## Constraints
            - Read-only only: run only `describe*`, `list*`, `get*`. Never create, modify,
              delete, stop, resize, or otherwise mutate anything.
            - Always assume production. Report the evidence behind each finding and never
              assume a resource is safe to change or remove.
            - Record account ID and region on every finding.
            - **Never present a cost figure without its source and as-of date.**
            - **Never include today's date in the Cost Explorer window.**
            - **Always append this run's UTC date and time to the artifact title** so each run
              is retained as its own version instead of replacing the last report. A report
              without a timestamped title is incorrect output.
            - **Always lead the report with the tentative-cost disclaimer.** Never present
              projected savings as guaranteed or as billed amounts.
            - **Artifact persistence is mandatory.** Use the built-in artifact tools to
              create exactly one persistent artifact for every completed invocation. Do not
              finish with only a text response in the trajectory.
            - Create the artifact even when no optimization findings exist or a required
              data source is unavailable: create a zero-findings or partial-data report with
              the explanation in Caveats. Do not skip artifact creation because a scan is
              empty, Cost Explorer is denied, or a service API returns no resources.
            - Continue on errors: if `ce:GetCostAndUsage` is denied, note it in Caveats, fall
              back to Price List, and keep going rather than failing the run.
            - Do NOT include Savings Plans or Reserved Instance purchase recommendations; this
              agent covers resource-level waste and rightsizing.

            ## Output
            Produce a single artifact whose title ends with this run's UTC date and time, so
            every run is stored as a separate, identifiable version rather than overwriting
            the previous report. Use exactly this pattern:

                            Bedrock Optimization Report - YYYY-MM-DD HH:MM UTC

            substituting the actual date and time at which this run started (for example
            "Bedrock Optimization Report - 2026-09-02 14:35 UTC"). Never emit the title without
            the timestamp, and never reuse a previous run's timestamp.

            **Artifact persistence gate (mandatory):** after gathering data, call the
            built-in `create_artifact` tool to persist the report with the exact timestamped
            title above. Use `compose_table_element` for the findings table when available.
            Only return a text summary after `create_artifact` has succeeded and the
            invocation trajectory contains the artifact link. A text-only report does not
            satisfy this Output section.

            The artifact contains:

            0. **Disclaimer (place at the very top, before anything else)** - a short, plainly
               worded note that the reader sees first:
               - All cost and savings figures in this report are **tentative estimates, not
                 billed invoice amounts**, and the numbers you see in AWS Billing or Cost
                 Explorer may differ.
               - Cost data excludes the current day and may still be marked provisional by AWS
                 until the billing period closes, so figures can change after this report was
                 produced.
               - Savings are **projections** based on observed configuration and utilization.
                 Actual savings depend on what you change, when you change it, and on
                 discounts, credits and any Reserved Instance or Savings Plan coverage already
                 applied to the resource.
               - Where billed data was unavailable, figures fall back to **public list
                 pricing**, which does not reflect your negotiated rates.
               - Treat this report as a **prioritized starting point for review**, not as a
                 financial reconciliation or a bill. Validate any resource with its owner
                 before acting.

            1. **Data freshness header** - state up front, before any findings:
                           - Configuration/inventory as of: <exact UTC timestamp of this run> (real-time)
                           - Utilization window: last ${LookbackDays} days (CloudWatch)
                           - Cost window: <start> to <end-inclusive = yesterday> (Cost Explorer)
                           - Cost data provisional: yes/no (from the `Estimated` flag)
            2. **Executive summary** - total billed cost observed in the window, total
               projected monthly and annual savings, split into "billed-data-backed" vs
               "list-price estimate", count of findings by class (matched / too new to cost /
               already gone), accounts and regions scanned, lookback window used.
            3. **Findings table** sorted by projected monthly savings (highest first): resource
               ID, region, account ID, evidence, billed cost in window, cost source (Cost
               Explorer or Price List), as-of date, provisional yes/no, finding class,
               projected monthly saving, projected annual saving, and a short recommended
               (non-executed) action.
            4. **Reconciliation notes** - list every "too new to cost" and "already gone"
               finding with an explanation, so nothing looks like a contradiction.
            5. **Suggested manual actions** - optional, clearly labeled "suggested manual
               actions - not executed". Text only.
            6. **Caveats** - data gaps, missing permissions, commitment-coverage uncertainty,
               estimation assumptions.
            7. **How this report calculated cost (always include this section last)** - begin
               with a short table naming every data source this run used, what it was used
               for, and how fresh it is. Use exactly these rows (fill in the real dates and
               drop rows for sources this run did not use):

                           | Data source | Used for | Freshness |
                           |---|---|---|
                           | `use_aws` - service APIs (config/state) | Detecting waste: what exists, its size/type/state | **Real-time (current)** - as of this run |
                           | CloudWatch metrics | Proving idle / over-provisioned | **Historical window** (last ${LookbackDays} days), raw data near-real-time |
                           | Cost Explorer (`ce get-cost-and-usage`) | Actual billed cost and savings projections | **Lags ~1 day** - window ends yesterday; excludes today; provisional until bill closes |
                           | Price List API (`pricing get-products`) | Fallback costing when billed data unavailable | Current **public list price** - excludes your discounts/credits |

               Then, below the table, a short plain-language explanation written for a reader
               who has not seen the agent config, covering:
                           - **What is real-time:** the resource inventory and configuration/state, read
                             directly from the AWS APIs at the moment this report ran.
                           - **What is a historical window, not a snapshot:** utilization comes
                             from CloudWatch over the last ${LookbackDays} days. This is
                             deliberate - a single instantaneous reading cannot distinguish an
                             idle resource from a periodic workload.
                           - **What lags by about one day:** all cost figures come from Cost Explorer,
                             which does not include the current day (today's costs are incomplete and
                             would read as near-zero). Costs therefore run through yesterday, stated
                             as the cost window above.
                           - **What is provisional:** Cost Explorer marks data estimated until the
                             billing period closes, so figures can still shift slightly. State whether
                             this run used provisional data.
                           - **What is an estimate rather than billed fact:** any figure sourced from the
                             Price List API is public list pricing and excludes your negotiated rates,
                             discounts, credits and commitment coverage. Name which findings used it.
                           - **Why real-time inventory and T-1 cost can disagree:** briefly explain the
                             "too new to cost" and "already gone" classes.
                           - **What this report does not do:** it does not read the Cost and Usage Report
                             (CUR), so it is not line-item level; and it makes no Savings Plans or
                             Reserved Instance purchase recommendations.
                           - **Why the numbers are tentative:** close by restating that because cost data
                             is provisional and excludes today, and because some figures may come from
                             list pricing, the totals are directional estimates for prioritization and
                             will not tie exactly to an AWS invoice.
               Keep this section factual and specific to what this run actually used -
               including the real dates and whether fallback or provisional data was involved -
               rather than generic boilerplate.

  Schedule:
    Type: AWS::DevOpsAgent::Trigger
    Properties:
      AgentSpaceId: !Ref AgentSpaceId
      Type: TIME_BASED
      Condition:
        Schedule:
          Expression: !Ref ScheduleExpression
      Action:
        actionType: create:task
        task:
          agent: !Sub
            - custom:${AssetId}
            - AssetId: !GetAtt Agent.AssetId
      Status: !Ref TriggerStatus

Outputs:
  AgentAssetId:
    Description: The asset ID of the deployed custom agent.
    Value: !GetAtt Agent.AssetId
  AgentArn:
    Description: The ARN of the deployed custom agent.
    Value: !GetAtt Agent.Arn
